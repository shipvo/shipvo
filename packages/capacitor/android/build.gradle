apply plugin: 'com.android.library'

android {
    namespace = "dev.shipvo.capacitor"
    compileSdk = rootProject.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
    // bzip2 for the BSDIFF40 patch step; the same version packages/runtime uses.
    implementation 'org.apache.commons:commons-compress:1.21'
    testImplementation "junit:junit:4.13.2"
}
