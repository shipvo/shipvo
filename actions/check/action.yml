name: Shipvo check
description: Build the app for web, run shipvo test, then shipvo explore. Fails on test regressions and crashes, not on exploration notes.
inputs:
  node-version:
    description: Node version
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install
      shell: bash
      run: |
        if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
        elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
        elif [ -f package-lock.json ]; then npm ci
        else npm install; fi
    - name: Install Chromium
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Build for web
      shell: bash
      run: PN_SIM=1 npx expo export --platform web --output-dir sim-dist --clear
    - name: Test and explore
      id: run
      shell: bash
      run: |
        npx shipvo sim --port 4545 > sim.log 2>&1 &
        SIM_PID=$!
        for i in $(seq 1 90); do curl -sf http://localhost:4545/app/ > /dev/null && break; sleep 2; done
        rc=0
        # Written first so a setup failure below still fails the Result step.
        echo "rc=1" >> "$GITHUB_OUTPUT"
        # BASE_SHA is empty on push events, so the full walk runs there.
        npx shipvo ci check ${BASE_SHA:+--changed-from "$BASE_SHA"} || rc=$?
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # Screenshots need the PR build on port 4545, so they run before the PR simulator is stopped.
          npx shipvo ci shots --changed-from "$BASE_SHA" || true
          # The same screens on Android and iOS, for the before and after section of the comment.
          npx shipvo ci shots --changed-from "$BASE_SHA" --skins android,ios --out shipvo-shots/after || true
          # Run the same flows on the base commit, built in a second folder, for the regression comparison.
          # The simulator serves one build at a time, so the PR build is stopped first.
          rm -rf shipvo-base
          if git worktree add shipvo-base "$BASE_SHA" > /dev/null 2>&1; then
            pkill -P $SIM_PID 2>/dev/null || true
            kill $SIM_PID 2>/dev/null || true
            (
              cd shipvo-base
              if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
              elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
              elif [ -f package-lock.json ]; then npm ci
              else npm install; fi
              PN_SIM=1 npx expo export --platform web --output-dir sim-dist --clear
              npx shipvo sim --port 4545 > ../sim-base.log 2>&1 &
              for i in $(seq 1 90); do curl -sf http://localhost:4545/app/ > /dev/null && break; sleep 2; done
              npx shipvo test --report ../shipvo-base-report.json || true
              [ -f ../shipvo-shots/after/screens.json ] && { npx shipvo ci shots --skins android,ios --screens-file ../shipvo-shots/after/screens.json --out ../shipvo-shots/before || true; }
              kill $! 2>/dev/null || true
            ) > shipvo-base.log 2>&1 || echo "Base run failed, see shipvo-base.log. The comment has no comparison."
            git worktree remove --force shipvo-base || true
          else
            echo "Base commit not available (the checkout needs fetch-depth: 0), skipping comparison."
          fi
          [ -d shipvo-shots/before ] || echo "No before images: the base build did not produce screenshots, so the comment has no Before and after section."
        fi
        # The comment is posted by the next step, the only one that gets the token. A failed flow fails the check there.
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - name: Comment on the pull request
      id: comment
      if: github.event_name == 'pull_request'
      shell: bash
      # This step posts the comment and uploads the images with the job token. When the token cannot write, the images are left out.
      run: |
        cr=0
        npx shipvo ci comment --changed-from "$BASE_SHA" --pr "$PR_NUMBER" --base-report shipvo-base-report.json --fail-on-regression || cr=$?
        # Only exit 1 (a regression) fails the check; other codes are ignored.
        if [ "$cr" = "1" ]; then echo "rc=1" >> "$GITHUB_OUTPUT"; fi
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shipvo-check
        path: |
          explore-report.md
          explore-report.json
          shipvo-report.json
          shipvo-base-report.json
          shipvo-base.log
          shipvo-shots/
        if-no-files-found: ignore
    # Relies on "Test and explore" always exiting 0 so the comment step runs; earlier failures already fail the job.
    - name: Result
      if: always()
      shell: bash
      run: |
        if [ "${RUN_RC:-0}" != "0" ] || [ "${COMMENT_RC:-0}" = "1" ]; then echo "The check failed. See the steps above."; exit 1; fi
      env:
        RUN_RC: ${{ steps.run.outputs.rc }}
        COMMENT_RC: ${{ steps.comment.outputs.rc }}
