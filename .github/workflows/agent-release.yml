# Release train (no AI): once a day, if main is green, publishes a patch release of every
# @shipvo package whose code changed, with a CHANGELOG entry and a tag. Pushing main to the
# `release` branch runs publish-npm. Set the repo variable AGENT_RELEASES=false to stop releases.
name: agent-release
on:
  schedule: [{ cron: "41 18 * * *" }]
  # GitHub often drops or delays the schedule on this repo, so also try after each merge-bot pass;
  # the gate below only goes ahead after 18:41 UTC and once per day.
  workflow_run: { workflows: [agent-merger], types: [completed] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "agent-release-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}" }   # merge-bot triggers must not bump a manual release out of the queue
jobs:
  release:
    if: vars.AGENTS_PAUSED != 'true' && vars.AGENT_RELEASES != 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
      R: ${{ github.repository }}
    steps:
      - name: Only release a green main
        id: gate
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::Add the AGENT_TOKEN secret"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            [ "$(date -u +%H%M)" -ge 1841 ] || { echo "before 18:41 UTC"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
            if gh api "repos/$R/git/ref/tags/release-$(date -u +%Y%m%d)" >/dev/null 2>&1; then echo "already released today"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          # Main moves every few minutes, so its newest commit is often still in CI. Release the newest of the
          # last 15 main commits whose CI passed; a failed one on the way stops the search (and opens a ci-main issue).
          SHA=""; CI="none"
          for s in $(gh api "repos/$R/commits?sha=main&per_page=15" --jq '.[].sha'); do
            c=$(gh api "repos/$R/commits/$s/check-runs?check_name=test" --jq '[.check_runs[]|.conclusion][0] // "none"')
            if [ "$c" = "success" ]; then SHA=$s; CI=success; break; fi
            if [ "$c" = "failure" ]; then CI=failure; break; fi
          done
          RED=$(gh issue list -R $R --label ci-main --state open --json number --jq length)
          echo "main $SHA ci=$CI open-ci-issues=$RED"
          if [ "$CI" = "success" ] && [ "$RED" = "0" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with: { ref: "${{ steps.gate.outputs.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Bump changed packages
        if: steps.gate.outputs.go == 'true'
        run: node scripts/agents/release.mjs
      - name: Changelog, commit, tag, push to release
        if: steps.gate.outputs.go == 'true'
        run: |
          N=$(node -e "console.log(require('/tmp/release.json').length)")
          [ "$N" != "0" ] || { echo "nothing to release"; exit 0; }
          DATE=$(date -u +%Y-%m-%d); TAG="release-$(date -u +%Y%m%d)"
          # A second release on the same day (an owner-started one) gets the time in its tag.
          if gh api "repos/$R/git/ref/tags/$TAG" >/dev/null 2>&1; then TAG="$TAG-$(date -u +%H%M)"; fi
          node - <<'JS'
          const fs = require("fs"); const r = require("/tmp/release.json");
          const date = new Date().toISOString().slice(0, 10);
          // Changelog entries written by each PR in changes/*.md go into this release's section, then are deleted.
          const frag = fs.existsSync("changes") ? fs.readdirSync("changes").filter((f) => f.endsWith(".md") && f !== "README.md").sort() : [];
          const notes = frag.map((f) => fs.readFileSync("changes/" + f, "utf8").trim()).filter(Boolean).join("\n");
          frag.forEach((f) => fs.unlinkSync("changes/" + f));
          let entry = `## ${date} (release)\n\n` + r.map((p) => `- **${p.name} ${p.to}**: ${p.changes.slice(0, 5).map((c) => c.replace(/ \(#\d+\)$/, "")).join("; ")}`).join("\n") + "\n\n" + (notes ? `### Changes\n\n${notes}\n\n` : "");
          const c = fs.readFileSync("CHANGELOG.md", "utf8"); const i = c.indexOf("\n## ");
          fs.writeFileSync("CHANGELOG.md", i < 0 ? c + "\n" + entry : c.slice(0, i + 1) + entry + c.slice(i + 1));
          JS
          git config user.name "Anye Happiness Ade"; git config user.email "hans@pipilot.dev"
          git add -A packages CHANGELOG.md changes
          git commit -qm "release: $(node -e "console.log(require('/tmp/release.json').map(p=>p.name+' '+p.to).join(', '))")"
          git tag -a "$TAG" -m "Release $DATE"
          U="https://x-access-token:${GH_TOKEN}@github.com/${R}.git"
          # If main moved since the gate, do not tag or publish this commit; the next pass starts from the new main.
          git push "$U" HEAD:refs/heads/main || { echo "main moved; trying again on the next pass"; exit 0; }
          git push "$U" "$TAG"
          git push --force "$U" HEAD:refs/heads/release
          echo "released: $(cat /tmp/release.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(p=>p.name+" "+p.to).join(", ")))')" >> "$GITHUB_STEP_SUMMARY"
