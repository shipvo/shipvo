# Fix engineer: when CI fails on an agent PR, the reviewer asks for changes, or the branch conflicts,
# Claude, Mistral and Aider fix their own PRs; Claude also fixes any leftover Copilot PRs.
# After AGENT_MAX_FIX_ROUNDS attempts the PR is closed and the issue goes to the next engineer.
# A red CI on main becomes an urgent issue for the Claude engineer.
name: agent-fixer
on:
  workflow_run: { workflows: [ci, ios-runtime, android-runtime], types: [completed] }
  pull_request: { types: [labeled] }
  # GitHub sends no pull_request events for a PR with merge conflicts, so the merge bot calls this directly.
  workflow_dispatch:
    inputs:
      pr: { description: "PR number", required: true }
      branch: { description: "PR head branch", required: true }
      label: { description: "Why: agent:conflict or agent:changes-requested", required: false, default: "agent:changes-requested" }
permissions: { contents: read, issues: write, pull-requests: write, actions: read, id-token: write }
jobs:
  route:
    concurrency: { group: "agent-fix-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || inputs.branch }}" }
    if: >-
      vars.AGENTS_PAUSED != 'true' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
        (github.event_name == 'pull_request' && contains(fromJSON('["agent:changes-requested","agent:conflict"]'), github.event.label.name)) ||
        github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.r.outputs.pr }}
      branch: ${{ steps.r.outputs.branch }}
      engine: ${{ steps.r.outputs.engine }}
      provider: ${{ steps.r.outputs.provider }}
      vars: ${{ steps.r.outputs.vars }}
    env:
      GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
      R: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || inputs.branch }}
      EVENT: ${{ github.event_name }}
      LABEL: ${{ github.event.label.name || inputs.label }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      MAX_ROUNDS: ${{ vars.AGENT_MAX_FIX_ROUNDS || 3 }}
    steps:
      - id: r
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::Add the AGENT_TOKEN secret (see .github/agents/README.md)"; exit 0; }
          python3 - <<'EOF'
          import json, os, re, subprocess
          E = os.environ; R = E["R"]; B = E["BRANCH"]
          def gh(*a): return subprocess.run(["gh", *a], text=True, capture_output=True).stdout
          out = open(E["GITHUB_OUTPUT"], "a")
          if E["EVENT"] == "workflow_run":
              # A job GitHub never started (no runner free, e.g. macOS capacity) is not a code failure:
              # run it again later instead of asking an engineer to fix code.
              jobs = json.loads(gh("api", f"repos/{R}/actions/runs/{E['RUN_ID']}/jobs", "--jq", ".jobs") or "[]")
              bad = [j for j in jobs if j["conclusion"] in ("failure", "cancelled", "timed_out")]
              if bad and all(not j.get("steps") for j in bad):
                  if int(E.get("RUN_ATTEMPT") or 1) < 4:
                      subprocess.run(["bash", "-c", f"sleep 600; gh api -X POST repos/{R}/actions/runs/{E['RUN_ID']}/rerun-failed-jobs"])
                      print("jobs never got a runner; re-ran them")
                  else:
                      print("jobs never got a runner after several attempts; leaving it for the next push")
                  raise SystemExit
          if B == "main":
              if E["EVENT"] != "workflow_run": raise SystemExit
              if json.loads(gh("issue", "list", "-R", R, "--label", "ci-main", "--state", "open", "--json", "number") or "[]"):
                  print("main CI issue already open"); raise SystemExit
              gh("issue", "create", "-R", R, "--title", "CI is failing on main",
                 "--label", "agent:ready", "--label", "agent:claude", "--label", "priority:urgent", "--label", "type:bug", "--label", "ci-main",
                 "--body", f"**Problem**\nThe `ci` workflow failed on `main`: {E['RUN_URL']}\n\n**What to do**\nRead the failing log (`gh run view {E['RUN_ID']} --log-failed`), find the cause and fix it.\n\n**Acceptance criteria**\n- [ ] `ci` is green on the fix PR\n- [ ] The cause is explained in the PR body\n- [ ] No test is skipped or deleted to get green")
              print("opened main CI issue"); raise SystemExit
          prs = json.loads(gh("pr", "list", "-R", R, "--head", B, "--state", "open", "--json", "number,labels,body,headRefName") or "[]")
          if not prs: raise SystemExit
          pr = prs[0]; n = pr["number"]; names = [l["name"] for l in pr["labels"]]
          if "agent-pr" not in names or "needs-human" in names: raise SystemExit
          rounds = max([int(x.split(":")[1]) for x in names if re.fullmatch(r"fix:\d+", x)] or [0])
          # A conflict caused by other PRs landing on main is not the engineer's failure: resolving it
          # never uses up a fix round, so an approved PR is never closed just because main moved.
          free = E["EVENT"] != "workflow_run" and E["LABEL"] == "agent:conflict" and not ({"agent:changes-requested", "contract:drift"} & set(names))
          if free: rounds_cap = False
          else: rounds_cap = rounds >= int(E["MAX_ROUNDS"])
          if rounds_cap and "contract:drift" in names:
              gh("pr", "edit", str(n), "-R", R, "--add-label", "needs-human", "--remove-label", "agent:changes-requested")
              gh("pr", "comment", str(n), "-R", R, "--body", f"Still drifting from the merge contract after {rounds} fix rounds. Waiting for the owner.")
              raise SystemExit
          if rounds_cap:
              gh("pr", "comment", str(n), "-R", R, "--body", f"Closing after {rounds} fix rounds without success. The issue goes back to the backlog for the other engineer.")
              gh("pr", "close", str(n), "-R", R, "--delete-branch")
              for m in re.finditer(r"(?:fixes|closes|resolves)\s+#(\d+)", pr["body"] or "", re.I):
                  i = m.group(1); il = gh("issue", "view", i, "-R", R, "--json", "labels")
                  order = ["agent:claude", "agent:mistral", "agent:aider"]
                  cur = next((x for x in order if x in il), "agent:aider")
                  if "agent:copilot" in il: gh("issue", "edit", i, "-R", R, "--remove-label", "agent:copilot")
                  # Mistral or Aider failing goes to Claude, the strongest engineer. Claude failing means the issue is
                  # too big or unclear: block it so the Head of Product re-slices it, instead of a weaker engineer retrying.
                  if cur != "agent:claude":
                      gh("issue", "edit", i, "-R", R, "--add-label", "agent:ready", "--add-label", "agent:claude", "--remove-label", cur,
                         "--remove-label", "agent:in-progress", "--remove-label", "agent:pr-open", "--remove-assignee", "Copilot")
                      gh("issue", "comment", i, "-R", R, "--body", f"PR #{n} failed {rounds} fix rounds; handed to the Claude engineer.")
                  else:
                      gh("issue", "edit", i, "-R", R, "--add-label", "agent:blocked", "--remove-label", "agent:in-progress", "--remove-label", "agent:pr-open")
                      gh("issue", "comment", i, "-R", R, "--body", f"PR #{n} failed {rounds} fix rounds with Claude. Blocked until the Head of Product re-slices it into smaller issues.")
              raise SystemExit
          if not free:
              if rounds: gh("pr", "edit", str(n), "-R", R, "--remove-label", f"fix:{rounds}")
              gh("label", "create", f"fix:{rounds+1}", "-R", R, "--color", "fbca04", "--force")
              gh("pr", "edit", str(n), "-R", R, "--add-label", f"fix:{rounds+1}", "--remove-label", "agent:changes-requested")
          if E["EVENT"] == "workflow_run":
              reason = f"CI failed: {E['RUN_URL']} (run id {E['RUN_ID']})."
          elif E["LABEL"] == "agent:conflict":
              reason = "The branch has merge conflicts with main. Resolve them, keeping the intent of both sides."
              if "contract:drift" in names: reason += " Then fix every item in the latest 'Contract: DRIFT' comment."
              elif "agent:changes-requested" in names: reason += " Then make the changes the reviewer requested in the latest review comment."
          else:
              reason = ("The merge contract check found drift; fix every item in the latest 'Contract: DRIFT' comment."
                        if "contract:drift" in names else "The reviewer requested changes; see the latest review comment on the PR.")
          if not (B.startswith("agent/") or B.startswith("copilot/")): raise SystemExit
          # Copilot PRs left over from before are fixed by Claude.
          engine = "aider" if B.startswith(("agent/aider/", "agent/mistral/")) else "claude"
          # Aider cannot resolve merge conflicts; Claude resolves them on any engineer's PR.
          if E["LABEL"] == "agent:conflict" and E["EVENT"] != "workflow_run": engine = "claude"
          provider = "mistral" if B.startswith("agent/mistral/") and engine == "aider" else "kilo"
          details = ""
          if engine == "aider":
              # Aider has no GitHub tools, so hand it the failing log and the latest review comment.
              if E.get("RUN_ID"):
                  details += "Failing CI log (last 150 lines):\n" + "\n".join(gh("run", "view", E["RUN_ID"], "-R", R, "--log-failed").splitlines()[-150:])
              cm = json.loads(gh("pr", "view", str(n), "-R", R, "--json", "comments") or "{}").get("comments", [])
              if cm: details += "\n\nLatest review comment:\n" + cm[-1]["body"][:6000]
          v = json.dumps({"PR": n, "BRANCH": B, "REASON": reason, "RUN_ID": E.get("RUN_ID") or "", "DETAILS": details})
          out.write(f"pr={n}\nbranch={B}\nengine={engine}\nprovider={provider}\nvars<<__V__\n{v}\n__V__\n")
          print(f"Claude will fix #{n} ({reason})")
          EOF
  fix:
    needs: route
    if: needs.route.outputs.pr != ''
    uses: ./.github/workflows/_agent-claude.yml
    secrets: inherit
    with:
      engine: ${{ needs.route.outputs.engine }}
      provider: ${{ needs.route.outputs.provider || 'kilo' }}
      role: ${{ needs.route.outputs.engine == 'aider' && 'fixer-aider' || 'fixer' }}
      mode: pr-branch
      branch: ${{ needs.route.outputs.branch }}
      pr: ${{ fromJSON(needs.route.outputs.pr) }}
      vars: ${{ needs.route.outputs.vars }}
      max_turns: 120
      timeout: 90
