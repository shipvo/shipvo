# Uploads PNGs from .shots/ to the media bucket, the same way the agent workflows do.
# Runs only on pushes to a shots branch that touch .shots/. Files land at https://shipvo.dev/media/<path under .shots/>.
name: upload-shots
on:
  push:
    branches: ["agent/claude/shots-*"]
    paths: [".shots/**"]
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload shots to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd .shots
          find . -type f -name '*.png' | sed 's#^./##' | while read -r f; do
            sz=$(stat -c %s "$f"); [ "$sz" -le 26214400 ] || { echo "::error::$f is over 25 MB"; exit 1; }
            for a in 1 2 3; do npx -y wrangler@4 r2 object put "shipvo-media/$f" --file "$f" --content-type image/png --cache-control "public, max-age=31536000, immutable" --remote && break; sleep $((a*10)); done
            echo "uploaded $f ($sz bytes) -> https://shipvo.dev/media/$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
