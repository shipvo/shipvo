# Docs Lead: three times a week, documents every new feature, matures the docs for developers and
# non-technical founders, and keeps CHANGELOG and the roadmap's "Now" list current.
name: agent-docs
on:
  schedule: [{ cron: "29 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: read, issues: write, pull-requests: write, actions: read, id-token: write }
concurrency: { group: agent-docs }
jobs:
  docs:
    uses: ./.github/workflows/_agent-claude.yml
    secrets: inherit
    with:
      role: docs
      mode: branch
      branch: agent/docs/${{ github.run_number }}
      pr_labels: agent:claude,type:docs
      max_turns: 150
      timeout: 90
