# Video Studio: one handcrafted educational video (code-built scenes, real simulator recordings, open-source narration) published on shipvo.dev.
name: agent-video
on:
  schedule: [{ cron: "23 8 * * 0,3" }]
  workflow_dispatch:
permissions: { contents: read, issues: write, pull-requests: write, actions: read, id-token: write }
concurrency: { group: agent-video }
jobs:
  run:
    uses: ./.github/workflows/_agent-claude.yml
    secrets: inherit
    with:
      role: video
      mode: branch
      branch: agent/video/${{ github.run_number }}
      pr_labels: agent:claude,video
      max_turns: 250
      timeout: 180
