name: publish-mcp-registry
# Publishes packages/mcp/server.json to the official MCP registry as io.github.shipvo/shipvo.
# Uses GitHub OIDC, which proves the org identity. No token needed.
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with OIDC
        working-directory: packages/mcp
        run: ../../mcp-publisher login github-oidc
      - name: Publish
        working-directory: packages/mcp
        run: ../../mcp-publisher publish
