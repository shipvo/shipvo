# Design Lead (senior UI/UX): twice a week, screenshots the site and product, ships the single
# highest-impact design improvement, and files design specs for the engineers.
name: agent-design
on:
  schedule: [{ cron: "13 5 * * 3,6" }]
  workflow_dispatch:
permissions: { contents: read, issues: write, pull-requests: write, actions: read, id-token: write }
concurrency: { group: agent-design }
jobs:
  design:
    uses: ./.github/workflows/_agent-claude.yml
    secrets: inherit
    with:
      role: design
      mode: branch
      branch: agent/design/${{ github.run_number }}
      pr_labels: agent:claude,design
      model: ${{ vars.AGENT_MODEL_LEAD || vars.AGENT_MODEL || 'claude-sonnet-5-5' }}
      max_turns: 150
      timeout: 90
