name: submit-awesome-mcp-servers
# Opens ONE pull request adding Shipvo to punkpeye/awesome-mcp-servers, from the account that owns PR_TOKEN.
# Needs repo secret PR_TOKEN: a classic PAT with the public_repo scope (fork + push + PR).
# dry_run defaults to false: running it opens the PR. Tick dry_run to only see the diff.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show the diff, open no PR
        type: boolean
        default: false
permissions: {}
jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      UP: punkpeye/awesome-mcp-servers
      BRANCH: add-shipvo
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        env: { GH_TOKEN: "${{ secrets.PR_TOKEN || secrets.ADMIN_TOKEN }}" }
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the PR_TOKEN secret first"; exit 1; }
          echo "ME=$(gh api user --jq .login)" >> "$GITHUB_ENV"
      - name: Clone upstream and add the entry
        run: |
          git clone --depth 1 "https://github.com/$UP" up
          cd up && git checkout -b "$BRANCH"
          python3 ../scripts/add-to-awesome-mcp-servers.py README.md
          git --no-pager diff --stat
          git --no-pager diff -U1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open the pull request
        if: ${{ !inputs.dry_run }}
        env: { GH_TOKEN: "${{ secrets.PR_TOKEN || secrets.ADMIN_TOKEN }}" }
        run: |
          set -e
          gh repo fork "$UP" --clone=false || true
          cd up
          git config user.name "$ME"; git config user.email "$ME@users.noreply.github.com"
          git commit -am "Add Shipvo (React Native mobile app simulator)"
          git remote add fork "https://x-access-token:$GH_TOKEN@github.com/$ME/awesome-mcp-servers.git"
          git push --force fork "$BRANCH"
          url=$(gh pr create --repo "$UP" --head "$ME:$BRANCH" \
            --title "Add Shipvo (React Native mobile app simulator)" \
            --body "Adds Shipvo, an MCP server that lets an assistant open a React Native app in a simulated phone, read the screen as an accessibility tree, tap and type, and change device state (deny camera, go offline, decline a payment). Hosted at https://sim.shipvo.dev/mcp and local via \`@shipvo/mcp\`. Apache-2.0, TypeScript. Also listed in the official MCP registry as \`io.github.shipvo/shipvo\`. I am the author.")
          echo "PR: $url" | tee -a "$GITHUB_STEP_SUMMARY"
