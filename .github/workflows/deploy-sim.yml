name: deploy-sim
# sim.shipvo.dev: builds the simulator container image and deploys the Worker in front of it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/sim/**", "packages/mcp/**", "packages/sim/server.mjs", ".github/workflows/deploy-sim.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { E2B_API_KEY: "${{ secrets.E2B_API_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipvo/mcp build
      - name: Apply control-plane migrations (api_keys, sim_sessions)
        working-directory: services/control-plane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply purenative --remote
      - name: Stage container build context
        run: |
          mkdir -p services/sim/build/sim services/sim/build/mcp
          cp packages/sim/server.mjs services/sim/build/sim/
          cp -r packages/mcp/dist services/sim/build/mcp/dist
      - name: Build the E2B template (one sandbox = one phone)
        if: ${{ env.E2B_API_KEY != '' }}
        working-directory: services/sim
        env: { E2B_API_KEY: "${{ secrets.E2B_API_KEY }}" }
        run: |
          set -o pipefail
          npx -y @e2b/cli@2 template create shipvo-sim --dockerfile Dockerfile --cmd "/app/entry.sh" --ready-cmd "curl -sf http://localhost:8787/health" --cpu-count 2 --memory-mb 2048 2>&1 | tee e2b-build.log
          grep -iE "finished|error" e2b-build.log | tail -3 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Worker secrets (E2B key, owner token)
        working-directory: services/sim
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          SIM_OWNER_TOKEN: ${{ secrets.SIM_OWNER_TOKEN }}
        run: |
          [ -n "$E2B_API_KEY" ] && printf '%s' "$E2B_API_KEY" | npx wrangler@4 secret put E2B_API_KEY || echo "E2B_API_KEY secret not set in GitHub: Worker will report backend=none"
          [ -n "$SIM_OWNER_TOKEN" ] && printf '%s' "$SIM_OWNER_TOKEN" | npx wrangler@4 secret put OWNER_TOKEN || true
      - name: Deploy shipvo-sim (worker)
        working-directory: services/sim
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler@4 deploy --var SIM_REV:${{ github.sha }} 2>&1 | tee deploy.log
          grep -E "https://|Deployed|Current Version" deploy.log | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Smoke (health, auth, and a real agent loop across reconnects)
        env: { SIM_SMOKE_KEY: "${{ secrets.SIM_SMOKE_KEY }}" }
        run: |
          U=https://sim.shipvo.dev
          curl -s $U/health; echo
          curl -s -o /dev/null -w "no key -> %{http_code}\n" -X POST $U/mcp -H 'content-type: application/json' -d '{}'
          if [ -n "$SIM_SMOKE_KEY" ]; then node services/sim/smoke.mjs $U/mcp "$SIM_SMOKE_KEY" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "SIM_SMOKE_KEY not set: agent-loop smoke skipped"; fi
