# Copilot is no longer an engineer on the team (credits). This hands any issue labelled agent:copilot
# to the Mistral engineer instead.
name: agent-copilot
on:
  issues: { types: [labeled] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  handover:
    if: vars.AGENTS_PAUSED != 'true' && (github.event_name != 'issues' || github.event.label.name == 'agent:copilot')
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ secrets.AGENT_TOKEN }}", R: "${{ github.repository }}" }
    steps:
      - run: |
          [ -n "$GH_TOKEN" ] || exit 0
          for n in $(gh api "repos/$R/issues?state=open&labels=agent:copilot&per_page=100" --jq '.[]|select(.pull_request==null)|.number'); do
            gh issue edit "$n" -R "$R" --remove-label agent:copilot --add-label agent:mistral --remove-assignee Copilot || true
            echo "#$n handed to the Mistral engineer"
          done
