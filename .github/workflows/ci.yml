name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @purenative/schema build
      - run: pnpm -r test
      - name: Design skill checks
        run: |
          cd skills/purenative-design
          python3 scripts/check_screen.py examples/screen-home.json --theme examples/theme.json --manifest examples/manifest.json
          python3 scripts/genericness_check.py --theme examples/theme.json --screen examples/screen-home.json
