name: ci
on:
  push: { branches: [main, "agent/**", "copilot/**"] }   # agent branches too: GitHub runs no pull_request CI while a PR has conflicts
  pull_request:
concurrency:
  # Main gets one group per run: a shared group still cancels a *pending* run when a newer one queues,
  # which cancelled most main runs even with cancel-in-progress off (runs 42124071938, 42124173204, 42124362052).
  group: "ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-${{ github.event_name }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never cancel CI on main
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a stuck step must fail within the hour, not hold the merge queue for the 6 h default
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No large files in git (media belongs in R2)
        if: github.event_name == 'pull_request'
        run: |
          BAD=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" | while read -r f; do if [ -f "$f" ] && [ "$(stat -c %s "$f")" -gt 2097152 ]; then echo "$f ($(stat -c %s "$f") bytes)"; fi; done || true)
          [ -z "$BAD" ] || { echo "::error::Files over 2 MB must not be committed (videos go to R2, see docs/videos.md):"; echo "$BAD"; exit 1; }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build every package first: tests may import a sibling @shipvo package through its dist (a new
      # package such as @shipvo/store would otherwise fail to resolve). pnpm -r builds in dependency order.
      - run: pnpm -r --filter "./packages/**" build
      # Package tests (e.g. @shipvo/sim) drive a headless browser, so install it before they run.
      - name: Install Chromium for browser tests
        timeout-minutes: 30
        run: bash scripts/agents/install-chromium.sh
      # Video tests (MCP demo recording, music mix) encode MP4 with ffmpeg + libx264. SHIPVO_REQUIRE_FFMPEG
      # tells them to fail, not skip, if it is missing.
      # The script times out stalled apt reads and retries (a plain apt-get hung 20+ min, ci run 42128194280).
      - name: Install ffmpeg
        timeout-minutes: 30
        run: bash scripts/agents/install-ffmpeg.sh
      - run: pnpm -r test
        env: { SHIPVO_REQUIRE_FFMPEG: "1" }
      # scripts/ is not a workspace package, so `pnpm -r test` skips these (escalation #634). They need the built packages.
      - name: Script tests (iOS e2e helpers, first-run, agent-efficiency)
        run: node --test scripts/ios-e2e/*.test.mjs scripts/first-run/*.test.mjs $(ls scripts/video/story/*.test.mjs 2>/dev/null) scripts/agent-efficiency/*.test.mjs
      - name: npm package size budget (each @shipvo package under 10 MB unpacked)
        run: |
          pnpm -r --filter "./packages/**" build > /dev/null
          for d in packages/*/; do
            (cd "$d" && npm pack --dry-run --json 2>/dev/null) | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s)[0];const kb=Math.round(j.unpackedSize/1024);console.log(j.name+': '+Math.round(j.size/1024)+' KB packed, '+kb+' KB unpacked, '+j.entryCount+' files');if(kb>10240){console.log('::error::'+j.name+' is over the 10 MB budget');process.exit(1)}})" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Device end-to-end through MCP (simulator, no phone)
        working-directory: apps/tide-and-tackle
        run: |
          pnpm --filter "@shipvo/cli..." build && pnpm --filter @shipvo/mcp build
          bash ../../scripts/agents/install-chromium.sh
          PN_SIM=1 npx expo export --platform web --output-dir sim-dist
          node sim/server.mjs --dir /tmp/pn-ui > sim.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:4545/app/ >/dev/null && break; sleep 1; done
          PN_SIM_DIR=/tmp/pn-ui node sim/e2e-device.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Typed simulator tests (@shipvo/test + Vitest) against the same simulator
        working-directory: apps/tide-and-tackle
        run: |
          pnpm --filter @shipvo/test build
          SHIPVO_APP=tide npx vitest run | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Design skill checks
        run: |
          cd skills/shipvo-design
          python3 scripts/check_screen.py examples/screen-home.json --theme examples/theme.json --manifest examples/manifest.json
          python3 scripts/genericness_check.py --theme examples/theme.json --screen examples/screen-home.json
