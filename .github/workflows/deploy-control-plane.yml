name: deploy-control-plane
on:
  push:
    branches: [main]
    paths: ["services/control-plane/**", "packages/schema/**", ".github/workflows/deploy-control-plane.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipvo/schema build
      - run: pnpm --filter @shipvo/control-plane test
      - name: Apply D1 migrations
        working-directory: services/control-plane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply purenative --remote
      - name: Deploy
        working-directory: services/control-plane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: GitHub login client id (device flow; optional until the OAuth app exists)
        working-directory: services/control-plane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
        run: |
          if [ -n "$GH_OAUTH_CLIENT_ID" ]; then printf '%s' "$GH_OAUTH_CLIENT_ID" | npx wrangler secret put GITHUB_CLIENT_ID
          else echo "GITHUB_OAUTH_CLIENT_ID secret not set; shipvo login stays disabled"; fi
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do curl -fsS https://purenative-control.purenative.workers.dev/health && exit 0; sleep 5; done; exit 1
