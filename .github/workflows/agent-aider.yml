# Aider engineer (open source, OpenAI-compatible provider such as the Kilo AI Gateway): implements
# issues labelled agent:aider and opens a PR.
# Starts when the label is added, and every 2 hours picks up the oldest waiting issue.
name: agent-aider
on:
  issues: { types: [labeled] }
  # Heartbeat: GitHub delays scheduled runs by hours on this repo, so also look for work whenever CI or the merge bot finishes.
  workflow_run: { workflows: [ci, agent-merger], types: [completed] }
  schedule: [{ cron: "53 * * * *" }]
  workflow_dispatch:
    inputs:
      issue: { description: "Issue number (optional)", type: number, required: false }
permissions: { contents: read, issues: write, pull-requests: write, actions: read, id-token: write }
jobs:
  pick:
    # One picker at a time per engineer, so two runs never take the same issue.
    concurrency: { group: "agent-aider-pick" }
    if: vars.AGENTS_PAUSED != 'true' && (github.event_name != 'issues' || github.event.label.name == 'agent:aider' || github.event.label.name == 'agent:ready')
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
      vars: ${{ steps.pick.outputs.vars }}
    env:
      GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
      REPO: ${{ github.repository }}
      WANT: ${{ github.event.issue.number || inputs.issue || '' }}
      EVENT: ${{ github.event_name }}   # a label event only starts work on issues that are also agent:ready
      MAX_ACTIVE: 1   # one docs or test task at a time (see Shipvo HQ merge rates)
    steps:
      - id: pick
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::Add the AGENT_TOKEN secret (see .github/agents/README.md)"; exit 0; }
          python3 - <<'EOF'
          import json, os, subprocess
          R = os.environ["REPO"]
          def gh(*a): return subprocess.check_output(["gh", *a], text=True)
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          active = json.loads(gh("pr", "list", "-R", R, "--label", "agent:aider", "--state", "open", "--json", "number"))
          busy = json.loads(gh("issue", "list", "-R", R, "--label", "agent:in-progress", "--label", "agent:aider", "--json", "number"))
          if len(active) + len(busy) >= int(os.environ["MAX_ACTIVE"]):
              print(f"at capacity ({len(active)} PRs, {len(busy)} in progress)"); raise SystemExit
          want = os.environ.get("WANT")
          if want:
              cands = [json.loads(gh("issue", "view", want, "-R", R, "--json", "number,title,body,labels,state,author"))]
          else:
              cands = json.loads(gh("issue", "list", "-R", R, "--label", "agent:ready", "--label", "agent:aider", "--state", "open",
                                    "--json", "number,title,body,labels,state,author", "--limit", "50"))
              cands.sort(key=lambda i: (not any(l["name"] in ("priority:urgent", "priority:high") for l in i["labels"]), i["number"]))
          skip = {"agent:in-progress", "agent:pr-open", "agent:blocked", "agent:waiting", "needs-human"}
          for i in cands:
              names = {l["name"] for l in i["labels"]}
              if i["state"] != "OPEN" or "agent:aider" not in names or names & skip: continue
              if os.environ.get("EVENT") == "issues" and "agent:ready" not in names:
                  print(f"#{i['number']}: not agent:ready yet; skipping"); continue
              perm = json.loads(gh("api", f"repos/{R}/collaborators/{i['author']['login']}/permission"))["permission"] if not i["author"].get("is_bot") else "bot"
              if perm not in ("admin", "maintain", "write", "bot"):
                  print(f"#{i['number']}: author {i['author']['login']} is not on the team; skipping"); continue
              # Measured on Shipvo HQ: this engineer merges few PRs outside docs and tests. Anything else goes to Claude.
              if not names & {"type:docs", "type:test"}:
                  gh("issue", "edit", str(i["number"]), "-R", R, "--remove-label", "agent:aider", "--add-label", "agent:claude")
                  gh("issue", "comment", str(i["number"]), "-R", R, "--body", "Moved to the Claude engineer: Aider takes only docs and test tasks.")
                  print(f"#{i['number']}: not a docs or test task; moved to Claude"); continue
              n = i["number"]
              gh("issue", "edit", str(n), "-R", R, "--add-label", "agent:in-progress")
              v = json.dumps({"ISSUE": n, "ISSUE_TEXT": f"# {i['title']}\n\n{i['body'] or ''}"})
              out.write(f"issue={n}\nvars<<__V__\n{v}\n__V__\n")
              print(f"picked #{n}"); break
          else:
              print("nothing to do")
          EOF
  build:
    needs: pick
    if: needs.pick.outputs.issue != ''
    uses: ./.github/workflows/_agent-claude.yml
    secrets: inherit
    with:
      engine: aider
      role: engineer-aider
      mode: branch
      branch: agent/aider/issue-${{ needs.pick.outputs.issue }}-${{ github.run_number }}
      issue: ${{ fromJSON(needs.pick.outputs.issue) }}
      pr_labels: agent:aider
      vars: ${{ needs.pick.outputs.vars }}
      max_turns: 150
      timeout: 100
