name: android-runtime
# Runs the Android OTA runtime's JVM unit tests (packages/runtime/android/src/test) on every change to the runtime,
# and its instrumented tests (packages/runtime/android/src/androidTest) on an API 34 emulator when there are any (#934).
# The runtime is an Expo module, so it is built inside the sample app's prebuilt Android project.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/runtime/**", ".github/workflows/android-runtime.yml"]
  pull_request:
    paths: ["packages/runtime/**", ".github/workflows/android-runtime.yml"]
permissions: { contents: read }
concurrency: { group: "android-runtime-${{ github.ref }}", cancel-in-progress: true }
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@shipvo/cli..." build
      - name: Prebuild the sample app's Android project
        working-directory: apps/tide-and-tackle
        run: CI=1 npx expo prebuild -p android --no-install
      - name: Run the runtime's unit tests
        working-directory: apps/tide-and-tackle/android
        run: |
          P=$(./gradlew -q projects --no-daemon | grep -oE "':?[^']*shipvo[^']*runtime[^']*'" | tr -d "'" | head -1)
          [ -n "$P" ] || { echo "::error::could not find the @shipvo/runtime Gradle project"; ./gradlew -q projects --no-daemon; exit 1; }
          case "$P" in :*) ;; *) P=":$P" ;; esac
          echo "runtime project: $P"
          ./gradlew "$P:testDebugUnitTest" --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Test summary
        if: always()
        run: |
          shopt -s globstar nullglob
          files=(packages/runtime/android/build/test-results/**/*.xml apps/tide-and-tackle/android/**/build/test-results/testDebugUnitTest/*.xml node_modules/@shipvo/runtime/android/build/test-results/**/*.xml)
          [ ${#files[@]} -gt 0 ] || { echo "No test results found." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const fs=require("fs");let t=0,f=0,s=0;const rows=[];
            for(const p of process.argv.slice(1)){const x=fs.readFileSync(p,"utf8");const m=x.match(/<testsuite[^>]*name="([^"]+)"[^>]*tests="(\d+)"[^>]*skipped="(\d+)"[^>]*failures="(\d+)"/);if(!m)continue;t+=+m[2];s+=+m[3];f+=+m[4];rows.push(`| ${m[1]} | ${m[2]} | ${m[4]} |`)}
            console.log(`### Android runtime unit tests\n\n${t} tests, ${f} failed, ${s} skipped.\n\n| Suite | Tests | Failed |\n| --- | --- | --- |\n${[...new Set(rows)].join("\n")}`)' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-runtime-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          if [ -d packages/runtime/android/src/androidTest ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "No instrumented tests in packages/runtime/android/src/androidTest." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Enable KVM
        if: steps.has.outputs.yes == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v4
        if: steps.has.outputs.yes == 'true'
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        if: steps.has.outputs.yes == 'true'
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        if: steps.has.outputs.yes == 'true'
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.has.outputs.yes == 'true'
      - if: steps.has.outputs.yes == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@shipvo/cli..." build
      - name: Prebuild the sample app's Android project
        if: steps.has.outputs.yes == 'true'
        working-directory: apps/tide-and-tackle
        run: CI=1 npx expo prebuild -p android --no-install
      - name: Build the runtime's test APK before the emulator starts
        if: steps.has.outputs.yes == 'true'
        id: proj
        working-directory: apps/tide-and-tackle/android
        run: |
          P=$(./gradlew -q projects --no-daemon | grep -oE "':?[^']*shipvo[^']*runtime[^']*'" | tr -d "'" | head -1)
          [ -n "$P" ] || { echo "::error::could not find the @shipvo/runtime Gradle project"; exit 1; }
          case "$P" in :*) ;; *) P=":$P" ;; esac
          echo "p=$P" >> "$GITHUB_OUTPUT"
          ./gradlew "$P:assembleDebugAndroidTest" --no-daemon -PreactNativeArchitectures=x86_64
      - name: Instrumented tests on the Android emulator (API 34, x86_64)
        if: steps.has.outputs.yes == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/tide-and-tackle/android
          script: ./gradlew "${{ steps.proj.outputs.p }}:connectedDebugAndroidTest" --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        if: always() && steps.has.outputs.yes == 'true'
        with:
          name: android-runtime-instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
