name: build-shell
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Shell version (versionName)"
        default: "1.0.0"
  push:
    branches: [main]
    paths: ["packages/runtime/**", "apps/tide-and-tackle/app.json", "apps/tide-and-tackle/package.json", ".github/workflows/build-shell.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipvo/schema build && pnpm --filter @shipvo/cli build
      - name: Prebuild
        working-directory: apps/tide-and-tackle
        run: CI=1 npx expo prebuild -p android --no-install
      - name: Assemble release APK (armeabi-v7a + arm64-v8a)
        working-directory: apps/tide-and-tackle/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Collect APK
        id: apk
        run: |
          APK=$(ls apps/tide-and-tackle/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" tide-and-tackle-shell.apk
          echo "size=$(stat -c %s tide-and-tackle-shell.apk)" >> $GITHUB_OUTPUT
          sha256sum tide-and-tackle-shell.apk
      - name: Register the APK's embedded bundle as a patch baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV: c0851feca4c5486d8ed844d16f0b36df
        run: |
          unzip -p tide-and-tackle-shell.apk assets/index.android.bundle > embedded.hbc
          SHA=$(sha256sum embedded.hbc | cut -d' ' -f1); SIZE=$(stat -c %s embedded.hbc)
          V=$(node -p "require('./apps/tide-and-tackle/app.json').expo.version")
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV/values"
          curl -fsS -X PUT "$API/b%2Ftide%2Fbase-$SHA.hbc" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/octet-stream" --data-binary @embedded.hbc >/dev/null
          curl -fsS -X PUT "$API/base%2Ftide%2F$V-${SHA:0:12}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            --data "{\"shell_version\":\"$V\",\"sha256\":\"$SHA\",\"size\":$SIZE,\"key\":\"b/tide/base-$SHA.hbc\"}" >/dev/null
          echo "Embedded bundle for shell $V: $SHA ($SIZE bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: tide-and-tackle-shell, path: tide-and-tackle-shell.apk }
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./apps/tide-and-tackle/app.json').expo.version")
          TAG="shell-$V-${{ github.run_number }}"
          gh release create "$TAG" tide-and-tackle-shell.apk --title "Tide & Tackle shell $TAG" \
            --notes "Sample shell APK for the Shipvo spike. Size: ${{ steps.apk.outputs.size }} bytes. Install by sideloading; updates after this arrive over the air." --prerelease

  # iOS: build the shell (Release, embedded main.jsbundle) and register that bundle as a patch base, tagged "platform": "ios",
  # so `shipvo publish --platform ios` can patch a fresh install's first update against it (issue #181).
  ios-base:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipvo/schema build && pnpm --filter @shipvo/cli build
      - name: Prebuild iOS and install pods
        working-directory: apps/tide-and-tackle
        run: |
          CI=1 npx expo prebuild -p ios --no-install
          cd ios && pod install 2>&1 | tail -5
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Build the shell (Release, embedded bundle)
        working-directory: apps/tide-and-tackle/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -20
          test ${PIPESTATUS[0]} -eq 0
      - name: Register the embedded bundle as an iOS patch baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV: c0851feca4c5486d8ed844d16f0b36df
        run: |
          APP=$(ls -d apps/tide-and-tackle/ios/build/Build/Products/Release-iphonesimulator/*.app | head -1)
          cp "$APP/main.jsbundle" embedded-ios.hbc
          SHA=$(shasum -a 256 embedded-ios.hbc | cut -d' ' -f1); SIZE=$(stat -f %z embedded-ios.hbc)
          V=$(node -p "require('./apps/tide-and-tackle/app.json').expo.version")
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV/values"
          curl -fsS -X PUT "$API/b%2Ftide%2Fbase-ios-$SHA.hbc" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/octet-stream" --data-binary @embedded-ios.hbc >/dev/null
          curl -fsS -X PUT "$API/base%2Ftide%2Fios-$V-${SHA:0:12}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
            --data "{\"platform\":\"ios\",\"shell_version\":\"$V\",\"sha256\":\"$SHA\",\"size\":$SIZE,\"key\":\"b/tide/base-ios-$SHA.hbc\"}" >/dev/null
          echo "Embedded iOS bundle for shell $V: $SHA ($SIZE bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
