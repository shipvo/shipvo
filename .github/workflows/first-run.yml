name: first-run
# Times a new developer's first run on a clean Linux runner, with no secrets (issue #264):
# shipvo init, install, doctor, the real bundle export and a real publish to a local control plane
# (the self-host Docker image, as in selfhost-smoke.yml). Writes the table to the run summary and
# uploads first-run.json, so an agent can quote the numbers with a link to this run.
on:
  workflow_dispatch:
  schedule: [{ cron: "41 4 * * 1" }]
  push:
    branches: [main]
    paths: ["packages/cli/**", "scripts/first-run/**", "services/control-plane/**", ".github/workflows/first-run.yml"]
permissions:
  contents: read
  actions: read
concurrency: { group: first-run, cancel-in-progress: true }
jobs:
  measure:
    name: measure (${{ matrix.template }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # All three init templates (#592). Each uploads first-run-<template>; blank keeps the old "first-run" name too.
    strategy:
      fail-fast: false
      matrix:
        template: [blank, shop, content]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      - name: Start the local control plane
        working-directory: services/control-plane
        run: |
          docker compose up -d --build
          for i in $(seq 1 120); do curl -sf localhost:8787/health > /dev/null && break; sleep 2; done
          curl -sf localhost:8787/health
      - name: Install Chromium for the first agent session (shipvo sim)
        run: bash scripts/agents/install-chromium.sh
      - name: Get the latest Android e2e report (android-e2e.yml)
        # Gives measure.mjs the emulator's publish-to-healthy figure (#441, #446). Missing report: the row says not measured.
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ID=$(gh run list -R "${{ github.repository }}" -w android-e2e.yml -s success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$ID" ] || { echo "no successful android-e2e run yet"; exit 0; }
          gh run download "$ID" -R "${{ github.repository }}" -n android-e2e-report -D "$RUNNER_TEMP/e2e" && echo "report from run $ID"
      - name: Measure the first run
        run: |
          # --with-session times a first agent session in the simulator (#348); only pass it once measure.mjs has it.
          # pipefail: without it the pipe into tee hid measure.mjs's exit 1 and failed runs showed green (#390).
          set -o pipefail
          SESSION=""; grep -q -- "--with-session" scripts/first-run/measure.mjs && SESSION="--with-session"
          # --apply-report arrives with #441; pass it only once measure.mjs has it and a report was downloaded.
          APPLY=(); R="$RUNNER_TEMP/e2e/android-e2e-report.json"
          grep -q -- "--apply-report" scripts/first-run/measure.mjs && [ -f "$R" ] && APPLY=(--apply-report "$R")
          rc=0
          node scripts/first-run/measure.mjs --template "${{ matrix.template }}" --with-install --with-test --with-export $SESSION "${APPLY[@]}" --control-url http://localhost:8787 \
            --out "$RUNNER_TEMP/first-run.json" | tee "$RUNNER_TEMP/first-run.md" || rc=$?
          { echo "### First run on ubuntu-latest, template ${{ matrix.template }} (clean runner, no secrets)"; echo; cat "$RUNNER_TEMP/first-run.md"; echo; \
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.template == 'blank' && 'first-run' || format('first-run-{0}', matrix.template) }}
          path: |
            ${{ runner.temp }}/first-run.json
            ${{ runner.temp }}/first-run.md
      - name: Control plane logs
        if: failure()
        working-directory: services/control-plane
        run: docker compose logs --no-color | tail -200
      - name: Stop
        if: always()
        working-directory: services/control-plane
        run: docker compose down -v

  # First applied OTA of a scaffolded app on the Android emulator (escalations #628, #634; script from PR #629).
  # Skips cleanly until scripts/first-run/applied-ota.mjs is on main.
  applied-ota:
    name: applied OTA (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: if [ -f scripts/first-run/applied-ota.mjs ]; then echo "script=1" >> "$GITHUB_OUTPUT"; else echo "applied-ota.mjs not on this ref yet, skipping"; fi
      - if: steps.has.outputs.script == '1'
        name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - if: steps.has.outputs.script == '1'
        uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - if: steps.has.outputs.script == '1'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.has.outputs.script == '1'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: steps.has.outputs.script == '1'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.has.outputs.script == '1'
        run: pnpm install --frozen-lockfile && pnpm -r --filter "./packages/**" build
      - if: steps.has.outputs.script == '1'
        name: Script tests
        run: node --test scripts/first-run/*.test.mjs
      - if: steps.has.outputs.script == '1'
        name: Start the local control plane
        working-directory: services/control-plane
        run: |
          docker compose up -d --build
          for i in $(seq 1 120); do curl -sf localhost:8787/health > /dev/null && break; sleep 2; done
          curl -sf localhost:8787/health
      - if: steps.has.outputs.script == '1'
        name: Time the first applied OTA on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # One line: the runner starts a new sh per line, and a pipe into tee would hide the script's exit code.
          script: node scripts/first-run/applied-ota.mjs --control-url http://localhost:8787 --out "$RUNNER_TEMP/applied-ota.json" > "$RUNNER_TEMP/applied-ota.md"; rc=$?; cat "$RUNNER_TEMP/applied-ota.md"; exit $rc
      - if: always() && steps.has.outputs.script == '1'
        name: Summary
        run: |
          { echo "### First applied OTA on the Android emulator (API 30, x86_64, pixel_5)"; echo; cat "$RUNNER_TEMP/applied-ota.md" 2>/dev/null || echo "No output."; echo; \
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.has.outputs.script == '1'
        with:
          name: applied-ota
          path: |
            ${{ runner.temp }}/applied-ota.json
            ${{ runner.temp }}/applied-ota.md
          if-no-files-found: ignore

  # Time `shipvo run` (Android and iOS) to a tappable phone page (escalation #712; script from PR #679).
  # Skips cleanly until scripts/first-run/run-time.mjs is on main.
  run-time:
    name: shipvo run, Android and iOS (time to first tap)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: if [ -f scripts/first-run/run-time.mjs ]; then echo "script=1" >> "$GITHUB_OUTPUT"; else echo "run-time.mjs not on this ref yet, skipping"; fi
      - if: steps.has.outputs.script == '1'
        uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - if: steps.has.outputs.script == '1'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.has.outputs.script == '1'
        run: pnpm install --frozen-lockfile && pnpm -r --filter "./packages/**" build
      - if: steps.has.outputs.script == '1'
        name: Install Chromium
        run: bash scripts/agents/install-chromium.sh
      - if: steps.has.outputs.script == '1'
        name: Time shipvo run (Android and iOS)
        run: |
          set -o pipefail
          rc=0
          node scripts/first-run/run-time.mjs --with-install --out "$RUNNER_TEMP/run-time.json" | tee "$RUNNER_TEMP/run-time.md" || rc=$?
          { echo "### shipvo run, Android and iOS, on ubuntu-latest (clean runner, no secrets)"; echo; cat "$RUNNER_TEMP/run-time.md"; echo; \
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always() && steps.has.outputs.script == '1'
        with:
          name: run-time
          path: |
            ${{ runner.temp }}/run-time.json
            ${{ runner.temp }}/run-time.md
          if-no-files-found: ignore
