name: publish-npm
on:
  push:
    tags: ["v*"]
    branches: [release]   # push main to `release` to publish the versions in package.json
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipvo/schema build && pnpm -r --filter "./packages/**" build
      - run: pnpm -r test
      - name: Publish @shipvo packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pub() {
            code=0; out=$(pnpm --filter "$1" publish --no-git-checks --access public 2>&1) || code=$?; echo "$out"
            if [ $code -ne 0 ] && echo "$out" | grep -qE "cannot publish over the previously published|Cannot publish over previously staged"; then echo "$1: version already on npm, skipping"; return 0; fi
            return $code
          }
          pub @shipvo/schema
          for pj in packages/*/package.json; do
            name=$(node -p "const p=require('./$pj'); p.private ? '' : p.name")
            [ -n "$name" ] && [ "$name" != "@shipvo/schema" ] || continue
            # The unscoped short names (shipvo, create-shipvo) need the npm token to cover unscoped packages;
            # a refusal there must not stop the @shipvo packages.
            case "$name" in @shipvo/*) pub "$name" ;; *) pub "$name" || echo "::warning::$name was not published (check the npm token covers unscoped packages)" ;; esac
          done
