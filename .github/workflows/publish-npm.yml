name: publish-npm
on:
  push:
    tags: ["v*"]
    branches: [release]   # push main to `release` to publish the versions in package.json
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @purenative/schema build && pnpm --filter purenative build
      - run: pnpm -r test
      - name: Publish @purenative/schema then purenative
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pnpm --filter @purenative/schema publish --no-git-checks --access public
          pnpm --filter purenative publish --no-git-checks --access public
