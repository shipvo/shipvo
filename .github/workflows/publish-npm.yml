name: publish-npm
on:
  push:
    tags: ["v*"]
    branches: [release]   # push main to `release` to publish the versions in package.json
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipvo/schema build && pnpm --filter @shipvo/cli build && pnpm --filter @shipvo/mcp build
      - run: pnpm -r test
      - name: Publish @shipvo/schema, @shipvo/cli, @shipvo/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pub() {
            code=0; out=$(pnpm --filter "$1" publish --no-git-checks --access public 2>&1) || code=$?; echo "$out"
            if [ $code -ne 0 ] && echo "$out" | grep -q "cannot publish over the previously published"; then echo "$1: version already on npm, skipping"; return 0; fi
            return $code
          }
          pub @shipvo/schema
          pub @shipvo/cli
          pub @shipvo/mcp
          pub @shipvo/device
