# Product Lead: every morning, turns the roadmap and the state of the repo into well-scoped issues
# for the Claude and Copilot engineers. Writes no code.
name: agent-planner
on:
  schedule: [{ cron: "17 5,11,17,23 * * *" }]
  workflow_dispatch:
permissions: { contents: read, issues: write, pull-requests: read, actions: read, id-token: write }
concurrency: { group: agent-planner }
jobs:
  plan:
    uses: ./.github/workflows/_agent-claude.yml
    secrets: inherit
    with:
      role: planner
      mode: read
      model: ${{ vars.AGENT_MODEL_LEAD || vars.AGENT_MODEL || 'claude-sonnet-5-5' }}
      max_turns: 120
      timeout: 40
      vars: '{"MAX_BACKLOG": "${{ vars.AGENT_MAX_BACKLOG || 20 }}", "MAX_NEW": "${{ vars.AGENT_MAX_NEW_ISSUES || 4 }}"}'
