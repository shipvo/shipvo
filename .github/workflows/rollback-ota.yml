name: rollback-ota
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Release whose code every device should go back to"
        required: true
      bands:
        description: "Cohort bands"
        default: "b0,b1,b2"
jobs:
  rollback:
    runs-on: ubuntu-latest
    concurrency: publish-ota
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipvo/schema build && pnpm --filter @shipvo/cli build
      - working-directory: apps/tide-and-tackle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHIPVO_SIGNING_SEED: ${{ secrets.PURENATIVE_SIGNING_SEED }}
        run: npx shipvo rollback --to "${{ inputs.to }}" --bands "${{ inputs.bands }}" | tee -a "$GITHUB_STEP_SUMMARY"
