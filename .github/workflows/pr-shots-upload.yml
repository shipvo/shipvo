# Uploads PR screenshots that a push ADDS under pr-shots/<pr>/ to the R2 bucket shipvo-media,
# so they are served at https://shipvo.dev/media/pr-shots/<pr>/<file>. It uses the same Cloudflare
# secrets and wrangler command as the agent workflows (_agent-claude.yml, "Upload media to R2").
# Put the images in a commit, push, and read the URLs from the run summary. Delete the images in a later
# commit if you do not want them in the history; the uploaded copies stay.
# Rules, enforced below: the path is pr-shots/<digits>/<name>.png|jpg with a plain file name, each file is at
# most 2 MB, and only files added by this push are uploaded. Objects are served as immutable, so an existing
# image is never replaced: use a new file name for a new version.
name: pr-shots-upload
on:
  push:
    branches-ignore: [main, release]
    paths: ["pr-shots/**"]
permissions: { contents: read }
concurrency: { group: "pr-shots-${{ github.ref }}", cancel-in-progress: false }
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Upload added images to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The base is the commit before the push. A new branch (all-zero BEFORE) or a force push (unknown BEFORE) falls back to where the branch left main.
          if [ "${BEFORE//0/}" = "" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main "$SHA")
          else
            BASE="$BEFORE"
          fi
          WRANGLER=wrangler@4.14.0
          npx -y "$WRANGLER" --version
          n=0
          while IFS= read -r -d '' f; do
            if ! [[ "$f" =~ ^pr-shots/[0-9]+/[A-Za-z0-9._-]+\.(png|jpg)$ ]]; then echo "skipped $f (path not allowed)"; continue; fi
            [ -f "$f" ] || continue
            case "$f" in *..*) echo "skipped $f"; continue;; esac
            case "$f" in *.png) ct=image/png;; *) ct=image/jpeg;; esac
            sz=$(stat -c %s "$f")
            [ "$sz" -le 2097152 ] || { echo "::error::$f is over 2 MB"; exit 1; }
            for a in 1 2 3; do
              npx -y "$WRANGLER" r2 object put "shipvo-media/$f" --file "$f" --content-type "$ct" --cache-control "public, max-age=31536000, immutable" --remote && break
              [ "$a" = 3 ] && { echo "::error::could not upload $f"; exit 1; }
              sleep $((a*10))
            done
            echo "uploaded $f ($sz bytes) -> https://shipvo.dev/media/$f" | tee -a "$GITHUB_STEP_SUMMARY"
            n=$((n+1))
          done < <(git diff --name-only -z --diff-filter=A "$BASE" "$SHA" -- pr-shots)
          echo "uploaded $n file(s)"
