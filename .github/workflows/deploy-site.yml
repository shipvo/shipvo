name: deploy-site
# shipvo.dev: the landing page and the marketplace (a Worker with static assets, in front of api.shipvo.dev).
on:
  push:
    branches: [main]
    paths: ["services/site/**", "docs/**", "blog/**", "README.md", "CHANGELOG.md", "packages/*/README.md", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build docs from the repo Markdown
        run: npm i --no-audit --no-fund --no-save marked@14 && node services/site/build.mjs
      - name: Media bucket (R2)
        working-directory: services/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Videos live in R2, not git. Create the bucket once; if the token cannot use R2, deploy without the
          # binding so the site never goes down over it (the /media/ route then returns 404).
          if npx wrangler@4 r2 bucket list 2>/dev/null | grep -q "shipvo-media" || npx wrangler@4 r2 bucket create shipvo-media; then
            echo "media bucket ready"
          else
            echo "::warning::Could not reach R2 with CLOUDFLARE_API_TOKEN (needs Workers R2 Storage: Edit). Deploying without /media."
            node -e "const f='wrangler.jsonc';const fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/\n\s*\"r2_buckets\".*\n/,'\n'))"
          fi
      - name: Deploy
        working-directory: services/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy 2>&1 | tee deploy.log && grep -E "https://|Deployed|Current Version" deploy.log | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS https://shipvo.dev/ | grep -q "Build once" && curl -fsS https://shipvo.dev/api/apps | grep -q '"apps"' && curl -fsS https://shipvo.dev/docs/getting-started/ | grep -q "Build your first app" && exit 0; sleep 10; done; exit 1
