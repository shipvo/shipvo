name: selfhost-smoke
# Builds the control-plane Docker image, starts it with docker compose and runs scripts/selfhost-smoke.mjs
# (health, create app, publish a signed pointer, read it back). Runs when the self-host setup changes.
on:
  workflow_dispatch:
  pull_request:
    paths: ["services/control-plane/**", "scripts/selfhost-smoke.mjs", ".dockerignore", ".github/workflows/selfhost-smoke.yml"]
  push:
    branches: [main]
    paths: ["services/control-plane/**", "scripts/selfhost-smoke.mjs", ".dockerignore", ".github/workflows/selfhost-smoke.yml"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Docker setup
        id: has
        run: |
          if [ -f services/control-plane/docker-compose.yml ] && [ -f scripts/selfhost-smoke.mjs ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "No Docker setup or smoke script on this commit; nothing to check."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: Build and start the control plane
        if: steps.has.outputs.ok == 'true'
        working-directory: services/control-plane
        run: docker compose up -d --build
      - name: Smoke test
        if: steps.has.outputs.ok == 'true'
        env: { SMOKE_TIMEOUT_S: "240" }
        run: node scripts/selfhost-smoke.mjs http://localhost:8787
      - name: Container logs
        if: failure() && steps.has.outputs.ok == 'true'
        working-directory: services/control-plane
        run: docker compose logs --no-color | tail -200
      - name: Stop
        if: always() && steps.has.outputs.ok == 'true'
        working-directory: services/control-plane
        run: docker compose down -v
