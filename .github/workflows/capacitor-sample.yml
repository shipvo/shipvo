name: capacitor-sample
# Builds the Capacitor 8 sample app (apps/capacitor-sample) for Android (Gradle, debug APK) and
# the iOS Simulator (xcodebuild, no signing), so adapter work on it is checked on every PR (escalation #429).
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/capacitor-sample/**", "pnpm-lock.yaml", ".github/workflows/capacitor-sample.yml"]
  push:
    branches: [main]
    paths: ["apps/capacitor-sample/**", ".github/workflows/capacitor-sample.yml"]
permissions:
  contents: read
concurrency: { group: "capacitor-sample-${{ github.ref }}", cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter capacitor-sample exec cap --version
      - run: pnpm --filter capacitor-sample sync android
      - name: Gradle assembleDebug
        working-directory: apps/capacitor-sample/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -la app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: capacitor-sample-debug-apk
          path: apps/capacitor-sample/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter capacitor-sample sync ios
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Build for the iOS Simulator (no signing)
        working-directory: apps/capacitor-sample/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -40
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capacitor-sample-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
