name: capacitor-sample
# Builds the Capacitor 8 sample app (apps/capacitor-sample) for Android (Gradle, debug APK) and
# the iOS Simulator (xcodebuild, no signing), so adapter work on it is checked on every PR (escalation #429).
# The android job also runs the JVM unit tests, and android-emulator runs the instrumented tests
# (src/androidTest of the app and of the @shipvo/capacitor plugin when linked) on an API 34 emulator (#934, #941, #947).
# The ios job also builds the plugin's Swift package (ShipvoPlugin against Capacitor) and runs its Swift tests
# on the iOS Simulator when packages/capacitor/Package.swift exists (escalation #1003).
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/capacitor-sample/**", "packages/capacitor/**", "pnpm-lock.yaml", ".github/workflows/capacitor-sample.yml"]
  push:
    branches: [main]
    paths: ["apps/capacitor-sample/**", "packages/capacitor/**", ".github/workflows/capacitor-sample.yml"]
permissions:
  contents: read
concurrency: { group: "capacitor-sample-${{ github.ref }}", cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter capacitor-sample exec cap --version
      - run: pnpm --filter capacitor-sample sync android
      - name: Gradle assembleDebug
        working-directory: apps/capacitor-sample/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -la app/build/outputs/apk/debug/
      - name: JVM unit tests (app and the @shipvo/capacitor plugin when linked)
        working-directory: apps/capacitor-sample/android
        run: |
          T=":app:testDebugUnitTest"
          for P in $(./gradlew -q projects --no-daemon | grep -oE "':?[^']*shipvo[^']*capacitor[^']*'" | tr -d "'" | sort -u); do
            case "$P" in :*) ;; *) P=":$P" ;; esac; T="$T $P:testDebugUnitTest"; done
          echo "tasks: $T"
          ./gradlew --no-daemon $T
      - uses: actions/upload-artifact@v4
        with:
          name: capacitor-sample-debug-apk
          path: apps/capacitor-sample/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter capacitor-sample sync android
      - name: Build the app and test APKs before the emulator starts
        id: tasks
        working-directory: apps/capacitor-sample/android
        run: |
          chmod +x gradlew
          T=":app:connectedDebugAndroidTest"; B=":app:assembleDebug :app:assembleDebugAndroidTest"
          for P in $(./gradlew -q projects --no-daemon | grep -oE "':?[^']*shipvo[^']*capacitor[^']*'" | tr -d "'" | sort -u); do
            case "$P" in :*) ;; *) P=":$P" ;; esac
            [ -d "$(./gradlew -q "$P:properties" --no-daemon | sed -n 's/^projectDir: //p')/src/androidTest" ] && { T="$T $P:connectedDebugAndroidTest"; B="$B $P:assembleDebugAndroidTest"; }
          done
          echo "tasks=$T" >> "$GITHUB_OUTPUT"; echo "instrumented: $T"
          ./gradlew --no-daemon $B
      - name: Instrumented tests on the Android emulator (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/capacitor-sample/android
          script: ./gradlew --no-daemon ${{ steps.tasks.outputs.tasks }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacitor-sample-instrumented-reports
          path: |
            apps/capacitor-sample/android/**/build/reports/androidTests/
            apps/capacitor-sample/android/**/build/outputs/androidTest-results/
            packages/capacitor/android/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter capacitor-sample sync ios
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Build for the iOS Simulator (no signing)
        working-directory: apps/capacitor-sample/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -40
      - name: Swift package tests on the iOS Simulator (@shipvo/capacitor)
        if: hashFiles('packages/capacitor/Package.swift') != ''
        working-directory: packages/capacitor
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | awk -F' [(]' '!f && /^ +iPhone [0-9]/ { sub(/^ +/, "", $1); print $1; f=1 }')
          echo "simulator: $SIM"
          # SwiftPM names the scheme <package>-Package when there are several products, else the product name.
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); w=d.get("workspace") or d.get("project") or {}; s=w.get("schemes",[]); print(next((x for x in s if x.endswith("-Package")), s[0] if s else ""))')
          echo "scheme: $SCHEME"
          [ -n "$SCHEME" ] || { echo "::error::no scheme in packages/capacitor"; xcodebuild -list; exit 1; }
          xcodebuild test -scheme "$SCHEME" -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodetest.log" \
            | grep -E "error:|Test Suite|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capacitor-sample-xcodebuild-log
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodetest.log
          if-no-files-found: ignore
