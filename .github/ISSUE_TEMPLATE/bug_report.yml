name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, what you got }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Shipvo version, placeholder: "@shipvo/cli x.y.z" }
  - type: textarea
    id: env
    attributes: { label: Environment, description: "OS, Node version, device or simulator" }
