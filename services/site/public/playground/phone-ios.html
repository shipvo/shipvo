.sf-group2{margin:6px 0;padding:8px 12px;border-radius:14px;background:#2c3036}.sf-group2 b{display:block;margin-bottom:6px}.sf-opts{display:flex;flex-wrap:wrap;gap:6px}.sf-opt{padding:8px 12px;border:1px solid #fff6;border-radius:999px;background:transparent;color:#fff;font:inherit}.sf-opt[aria-checked=true]{background:#4da3ff;color:#001;border-color:#4da3ff}

.sf-gear{margin:0 8px 8px 0;padding:8px 16px;border:1px solid #fff6;border-radius:999px;background:transparent;color:#fff}

.sf-store{position:absolute;inset:0;z-index:8;overflow:auto;padding:70px 20px 40px;box-sizing:border-box;background:#0b1320;color:#fff;font-family:system-ui,sans-serif}[data-theme="light"] .sf-store{background:#f4f7fb;color:#111}.sf-store[hidden]{display:none}.sf-store-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #8883;font:600 15px system-ui,sans-serif}.sf-store-row small{opacity:.6;font-weight:400}.sf-store-row button,.sf-store .sf-close{border:0;border-radius:999px;padding:12px 18px;min-height:44px;background:#f4a261;color:#102030;font:600 14px system-ui,sans-serif;cursor:pointer}.sf-store-have{color:#8a94a6;font-size:13px}[data-theme="light"] .sf-store-have{color:#4a5568}.sf-store .sf-close{margin-top:18px;background:#8883;color:inherit}.sf-consent{margin-top:16px;padding:14px;border-radius:14px;background:#8883}.sf-perm{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.sf-consent button[role=switch][aria-checked=false]{background:transparent;color:inherit;border:2px solid currentColor}.sf-consent button{margin:8px 8px 0 0}.sf-apps{position:absolute;left:28px;right:28px;top:180px;display:flex;flex-wrap:wrap;gap:20px 24px}.sf-apps .sf-icon{position:static}

.sf-bar{position:relative}.sf-navbtns{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:center;background:var(--sf-bg)}.sf-navbtns button{border:0;background:none;color:var(--sf-fg);font-size:16px;padding:2px 24px;cursor:pointer}.sf-body[data-nav="buttons"] .sf-bar i{display:none}

</style></head><body>
<div id="fit"><div id="phone" data-platform="ios"><div class="sf-body" data-skin="ios" data-theme="light" data-part="phone-body"><div class="sf-screen"><div class="sf-status" data-part="status-bar"><span class="sf-time" data-part="time">9:41</span><span class="sf-cut sf-island" data-part="dynamic-island"></span><span class="sf-icons"><svg class="sf-ico" data-part="signal" data-level="4" width="15" height="12" viewBox="0 0 15 12" aria-hidden="true"><rect x="0" y="10" width="3" height="3" rx="1" fill="currentColor"/><rect x="4" y="7" width="3" height="6" rx="1" fill="currentColor"/><rect x="8" y="4" width="3" height="9" rx="1" fill="currentColor"/><rect x="12" y="1" width="3" height="12" rx="1" fill="currentColor"/></svg><svg class="sf-ico" data-part="wifi" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4.5a10 10 0 0 1 14 0M3.5 7.2a6.4 6.4 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="10" r="1.4" fill="currentColor"/></svg><svg class="sf-ico" data-part="battery" data-level="100" width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x=".75" y=".75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/><rect x="3.5" y="3.5" width="15" height="5" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".6"/></svg></span></div><div class="sf-content"><iframe id="app" src="./app.html" title="Sample app, iOS"></iframe></div><div class="sf-update" data-part="update-banner" role="status" aria-live="polite" aria-label="Simulated update status" hidden><span data-part="update-banner-text"></span></div><div class="sf-grab" data-part="top-edge" aria-hidden="true"></div><div class="sf-panel" data-part="notification-center" role="dialog" aria-label="Notification Center" tabindex="-1" hidden><div class="sf-notes" data-part="notification-list"></div><button type="button" class="sf-clear" data-part="clear-all">Clear all</button><button type="button" class="sf-gear" data-part="settings-gear" aria-label="Settings">⚙ Settings</button><button type="button" class="sf-close" data-part="close">Close</button></div><div class="sf-panel" data-part="control-center" role="dialog" aria-label="Control Center" tabindex="-1" hidden><div class="sf-tiles" data-part="tiles"></div><button type="button" class="sf-gear" data-part="settings-gear" aria-label="Settings">⚙ Settings</button><button type="button" class="sf-close" data-part="close">Close</button></div><span class="sf-edge" data-part="edge-swipe"></span><div class="sf-home" data-part="home-screen" role="region" aria-label="Home screen" hidden><button type="button" class="sf-icon" data-part="app-icon" aria-label="App"><b>A</b><span>App</span></button><button type="button" class="sf-icon" data-part="settings-icon" aria-label="Settings" style="left:124px"><b>⚙</b><span>Settings</span></button><button type="button" class="sf-icon" data-part="store-icon" aria-label="Store" style="left:220px"><b>▤</b><span>Store</span></button></div><div class="sf-settings" data-part="settings-screen" role="dialog" aria-label="Settings" tabindex="-1" hidden><h2 class="sf-sh">Settings</h2><div data-part="settings-rows" role="group" aria-label="Settings"></div><button type="button" class="sf-srow" data-part="settings-secrets">Secrets</button><button type="button" class="sf-close" data-part="settings-close">Close</button></div><div class="sf-settings" data-part="secrets-screen" role="dialog" aria-label="Secrets" tabindex="-1" hidden><h2 class="sf-sh">Secrets</h2><p class="sf-error" data-part="secrets-error" role="alert" hidden></p><div data-part="secrets-rows" role="list" aria-label="Saved keys"></div><button type="button" class="sf-close" data-part="secrets-back">Back</button></div><div class="sf-settings sf-store" data-part="store-screen" role="dialog" aria-label="Store" tabindex="-1" hidden><h2 class="sf-sh">Store</h2><div data-part="sto <script>
function fit(){var s=Math.min(1,innerWidth/417,innerHeight/890),e=document.getElementById("fit");e.style.width="417px";e.style.height="890px";e.style.transform="translate(-50%,-50%) scale("+s+")"}
addEventListener("resize",fit);fit();
var last={},dev={},ota=1;
addEventListener("message",function(e){var d=e.data,a=document.getElementById("app");if(!d||!a||!a.contentWindow)return;if(d.type==="pg:tool"&&e.source!==a.contentWindow)a.contentWindow.postMessage(d,"*");else if(d.type==="pg:tool:result"&&e.source===a.contentWindow)parent.postMessage(d,"*")});
addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="pg:device")return;if(d.kind!=="notification")dev[d.kind]=d.value;var a=document.getElementById("app");if(a&&a.contentWindow)a.contentWindow.postMessage(d,"*")});
function send(){var a=document.getElementById("app");if(a&&a.contentWindow){a.contentWindow.postMessage(Object.assign({type:"pg:prefs"},last),"*");for(var k in dev)a.contentWindow.postMessage({type:"pg:device",kind:k,value:dev[k]},"*");a.contentWindow.postMessage({type:"pg:ota",version:ota},"*")}}
document.getElementById("app").addEventListener("load",send);
addEventListener("message",function(e){var d=e.data;if(d&&d.type==="pg:ota"){ota=d.version;send();return}if(!d||d.type!=="pg:prefs")return;last={dark:!!d.dark,large:!!d.large,rtl:!!d.rtl};
var b=document.querySelector(".sf-body");b.dataset.theme=last.dark?"dark":"light";b.style.setProperty("--sf-bg",last.dark?"#000":"#fff");b.style.setProperty("--sf-fg",last.dark?"#fff":"#111");
document.querySelector(".sf-status").style.setProperty("--sf-status-fg",last.dark?"#fff":"#111");send()});
</script></body></html>
