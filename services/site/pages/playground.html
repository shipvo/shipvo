<!doctype html>
<html lang="en">
<head>
<!--HEAD title="Playground: try Shipvo in your browser on an Android or iOS phone" desc="A sample app on an Android or iOS phone in your browser. Switch platform, dark mode, large text and right-to-left text, and open any Shipvo feature from the sidebar. No install, no account." path="/playground/"-->
<style>
.pg{margin-top:28px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.pg-side{display:flex;flex-direction:column;gap:6px}
.pg-side a{display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);color:inherit;text-decoration:none;font-weight:600}
.pg-side a[aria-current="true"]{background:var(--accent,#7cf);color:#04101a;border-color:transparent}
.pg-main{min-width:0}
.pg-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:16px}
.pg-bar button{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--ink-2);color:inherit;font:inherit;font-weight:600;cursor:pointer}
.pg-bar button[aria-pressed="true"]{background:var(--accent,#7cf);color:#04101a;border-color:transparent}
.pg-bar .sep{width:1px;align-self:stretch;background:var(--line)}
.pg-panel{margin:0 0 16px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:var(--ink-2);max-width:70ch}
.pg-panel h2{font-size:18px;margin:0 0 6px}.pg-panel p{margin:0 0 6px}
.pg-panel a{display:inline-flex;align-items:center;min-height:44px}
.pg-phone{width:100%;max-width:420px;height:min(860px,150vw);border:0;background:transparent;display:block;margin:0 auto}
.pg-steps{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.pg-steps button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--ink-2);color:inherit;font:inherit;font-weight:600;cursor:pointer}.pg-steps button:not(:disabled):not(.pg-reset){background:var(--accent,#7cf);color:var(--accent-ink,#04101a);border-color:transparent}.pg-steps button:focus-visible{outline:3px solid var(--paper,#fff);outline-offset:2px;box-shadow:0 0 0 2px var(--ink,#000)}.pg-steps button:disabled{opacity:.5;cursor:default}.pg-log{margin:8px 0 0;padding-left:20px;overflow-wrap:anywhere}.pg-log li{margin:0 0 4px}
@media (max-width:800px){.pg{grid-template-columns:1fr}.pg-side{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<!--NAV-->
<main>
<section style="border-top:0">
  <div class="wrap">
    <div class="eyebrow">Playground</div>
    <h1>Try Shipvo on an Android or iOS phone</h1>
    <p class="lede">A sample app runs on a simulated phone in your browser. Pick Android or iOS, turn on dark mode, large text or right-to-left text, and open a feature from the sidebar.</p>
    <div class="pg" id="playground">
      <nav class="pg-side" id="pg-side" aria-label="Features"><!--PG_LINKS--></nav>
      <div class="pg-main">
        <div class="pg-bar" role="toolbar" aria-label="Phone settings">
          <button type="button" id="pg-android" data-platform="android" aria-pressed="true">Android</button>
          <button type="button" id="pg-ios" data-platform="ios" aria-pressed="false">iOS</button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" id="pg-dark" aria-pressed="false">Dark mode</button>
          <button type="button" id="pg-large" aria-pressed="false">Large text</button>
          <button type="button" id="pg-rtl" aria-pressed="false">Right to left</button>
        </div>
        <section class="pg-panel" id="pg-panel" aria-live="polite"></section>
        <iframe class="pg-phone" id="pg-phone" title="Phone" data-src-android="/playground/phone-android.html" data-src-ios="/playground/phone-ios.html"></iframe>
      </div>
      <noscript><p>The playground needs JavaScript.</p></noscript>
    </div>
  </div>
</section>
</main>
<!--FOOTER-->
<script type="application/json" id="pg-features"><!--PG_JSON--></script>
<script src="/playground/playground.js"></script>
</body>
</html>
